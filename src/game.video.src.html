<head>

<style>
  :root{
    --wood-1:#7a2a1c; --wood-2:#4d1810; --cream:#fff3d6; --gold:#ffc83a; --ink:#2a0d08;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#1a1410;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;touch-action:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* Title sign */
  #title{position:fixed;left:min(2vw,28px);top:min(2vh,22px);padding:.55em 1.3em .5em;
    background:linear-gradient(180deg,var(--wood-1),var(--wood-2));
    border:3px solid #2e0f09;border-radius:12px;box-shadow:0 6px 0 #2a0c07,0 10px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.18);
    text-align:center;transform:rotate(-1.2deg);pointer-events:none}
  #title b{display:block;font-family:'Lilita One','Baloo 2',Impact,sans-serif;font-weight:400;letter-spacing:.04em;
    font-size:clamp(22px,4.2vw,54px);line-height:1;color:var(--cream);
    -webkit-text-stroke:2px #2a0d08;paint-order:stroke fill;text-shadow:0 3px 0 #2a0d08}
  #title i{display:block;font-style:normal;font-family:'Lilita One','Baloo 2',Impact,sans-serif;letter-spacing:.05em;
    font-size:clamp(10px,1.5vw,19px);color:var(--gold);margin-top:.15em;text-shadow:0 2px 0 #2a0d08}

  /* HUD right */
  #hud-r{position:fixed;right:min(2vw,26px);top:min(2vh,22px);display:flex;gap:10px;align-items:stretch}
  .panel{background:rgba(20,28,36,.62);border:1px solid rgba(255,255,255,.16);border-radius:12px;backdrop-filter:blur(6px);color:#fff}
  #dist{padding:.35em .9em .3em;text-align:left;min-width:150px}
  #dist small{display:block;font-size:11px;letter-spacing:.14em;opacity:.85;font-weight:800}
  #dist span{font-family:'Lilita One','Baloo 2',sans-serif;font-size:clamp(24px,3vw,36px);letter-spacing:.04em;line-height:1.05}
  #pause{width:54px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(20,28,36,.62);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
  #pause:active{transform:scale(.95)}
  #pause i{display:block;width:6px;height:22px;background:#fff;border-radius:2px;box-shadow:12px 0 0 #fff;margin-right:12px}
  body.paused #pause i{width:0;height:0;background:none;box-shadow:none;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;border-radius:0;margin:0 0 0 6px}

  /* Controls hint */
  #hint{position:fixed;right:min(2vw,26px);top:calc(min(2vh,22px) + 74px);padding:.8em 1.1em;font-size:14px;line-height:1.5;transition:opacity .6s}
  #hint h4{margin:0 0 .3em;font-size:15px}

  /* Joystick */
  #stick{position:fixed;left:max(3vw,22px);bottom:max(4vh,22px);width:clamp(110px,16vmin,168px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.22),rgba(40,40,40,.45));border:2px solid rgba(255,255,255,.55);
    box-shadow:0 4px 18px rgba(0,0,0,.3);touch-action:none}
  #stick .a{position:absolute;color:rgba(255,255,255,.8);font-size:clamp(11px,1.8vmin,18px);line-height:1}
  #stick .a.u{left:50%;top:7%;transform:translateX(-50%)} #stick .a.d{left:50%;bottom:7%;transform:translateX(-50%)}
  #stick .a.l{left:7%;top:50%;transform:translateY(-50%)} #stick .a.r{right:7%;top:50%;transform:translateY(-50%)}
  #knob{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;margin:-23% 0 0 -23%;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#fff,#d9d9d9 55%,#a9a9a9);box-shadow:0 3px 10px rgba(0,0,0,.45)}

  /* look hint */
  #look{position:fixed;right:min(2vw,26px);bottom:max(4vh,22px);display:flex;align-items:center;gap:.7em;padding:.7em 1.1em;
    font-weight:800;letter-spacing:.07em;font-size:13px;transition:opacity .8s}

  /* pause + loading */
  #veil{position:fixed;inset:0;display:none;place-items:center;background:rgba(20,10,5,.45);backdrop-filter:blur(3px)}
  body.paused #veil{display:grid}
  #veil div{font-family:'Lilita One',sans-serif;font-size:clamp(34px,7vw,80px);color:var(--cream);-webkit-text-stroke:3px #2a0d08;paint-order:stroke fill;text-align:center;line-height:1.05}
  #veil small{display:block;font-family:'Baloo 2',sans-serif;font-size:16px;-webkit-text-stroke:0;margin-top:.6em;opacity:.9}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#1a1410;color:#fff3d6;font-family:'Lilita One',sans-serif;font-size:28px;letter-spacing:.06em;z-index:9}

<script>
(() => {
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

/* ---------- assets ---------- */
const IMG = {};
function loadAll() {
  return Promise.all(Object.entries(ASSETS).map(([k, src]) => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG[k] = im; res(); };
    im.onerror = () => { console.warn('asset failed', k); res(); };
    im.src = src;
  })));
}

/* ---------- world definition (sizes in metres) ---------- */
const TYPES = {
  palm:   { key: v => 'palm' + v,   h: [9.5, 12] },
  arch:   { key: v => 'arch' + v,   h: [9.6, 9.6] },
  cafe:   { key: v => 'cafe' + v,   h: [3.1, 3.3] },
  board:  { key: v => 'board' + v,  h: [1.15, 1.3] },
  stall:  { key: v => 'stall',      h: [3.0, 3.2] },
  planter:{ key: v => 'planter' + v,h: [0.95, 1.2] },
  bench:  { key: v => 'bench' + v,  h: [1.05, 1.15] },
  lamp:   { key: v => 'lamp' + v,   h: [3.3, 3.5] },
  bin:    { key: v => 'bin' + v,    h: [0.95, 1.05] },
};
const COUNTS = { palm: 4, arch: 3, cafe: 3, board: 3, stall: 1, planter: 4, bench: 2, lamp: 3, bin: 2 };
const CHUNK = 48;
const PLAYER_H = 1.85;
const STREET_HALF = 3.4;     // walkable half-width
const MAX_DRAW = 125;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const chunkCache = new Map();
function genChunk(c) {
  if (chunkCache.has(c)) return chunkCache.get(c);
  const r = mulberry32(c * 7919 + 1337);
  const rv = n => 1 + Math.floor(r() * n);
  const items = [];
  const add = (type, x, z, v, scale) => {
    const t = TYPES[type];
    items.push({ type, x, z, v: v || 1, h: (t.h[0] + (t.h[1] - t.h[0]) * r()) * (scale || 1), side: Math.sign(x) || 1 });
  };
  const z0 = c * CHUNK;
  // arch spanning the street
  add('arch', 0, z0 + 30, ((c % 3) + 3) % 3 + 1);
  for (const side of [-1, 1]) {
    // palm avenue
    for (let k = 0; k < 4; k++) {
      add('palm', side * (5.0 + r() * 0.9), z0 + k * 12 + (side > 0 ? 6 : 0) + r() * 3, rv(4));
    }
    // street furniture
    let lastStall = -9;
    for (let k = 0; k < 6; k++) {
      const z = z0 + k * 8 + (side > 0 ? 3.5 : 0.5) + r() * 2;
      const roll = r();
      if (roll < 0.32) {
        add('cafe', side * (6.7 + r() * 1.1), z, rv(3));
        add('board', side * (4.75 + r() * 0.2), z - 1.2, rv(3));
      } else if (roll < 0.5) {
        add('planter', side * (4.6 + r() * 0.35), z, rv(4));
        if (r() < 0.6) add('planter', side * (4.6 + r() * 0.35), z + 2.2, rv(4));
      } else if (roll < 0.66) {
        add('bench', side * 4.9, z, rv(2));
      } else if (roll < 0.8) {
        add('lamp', side * 4.45, z, rv(3));
      } else if (roll < 0.9) {
        add('bin', side * 4.6, z, rv(2));
      } else if (k - lastStall > 2) {
        add('stall', side * 7.9, z, 1); lastStall = k;
      } else {
        add('planter', side * 4.7, z, rv(4));
      }
    }
    // regular lamps
    add('lamp', side * 4.2, z0 + 20 + (side > 0 ? 3 : 0), rv(3));
    // deeper plaza layer
    for (let k = 0; k < 4; k++) {
      const z = z0 + k * 12 + r() * 8;
      const roll = r();
      const x = side * (10.5 + r() * 4);
      if (roll < 0.5) add('palm', x, z, rv(4), 1.05);
      else if (roll < 0.82) add('cafe', x, z, rv(3), 1.1);
      else add('stall', x, z, 1, 1.1);
    }
  }
  // shopfront facades (generated after all props so prop placement is unchanged)
  items.facades = [];
  const oRoll = r(), oSide = oRoll < 0.35 ? (r() < 0.5 ? -1 : 1) : 0, oLen = 14 + r() * 12, oz1 = z0 + r() * (CHUNK - oLen), oz2 = oz1 + oLen;
  for (const side of [-1, 1]) {
    let z = z0, i = 0, open = side === oSide, prev = false;
    while (z < z0 + CHUNK - 3) {
      if (open && z >= oz1 - 0.01) { items.facades.push({ side, open: 1, z1: oz1, z2: oz2, key: c + ':' + side + ':o' }); z = oz2; open = false; prev = false; continue; }
      let gap = false;
      if (r() < 0.3) { z += 1.5 + r() * 1.5; gap = true; if (open && z >= oz1 - 0.01) continue; }
      const len = 6 + r() * 6, z2 = Math.min(z + len, z0 + CHUNK, open ? oz1 : 1e9);
      if (z2 - z < 3) { if (open && z < oz1) { z = oz1; prev = false; continue; } break; }
      const floors = 1 + Math.floor(r() * 2), h = 4 + 3 * floors + 0.5 + r() * 0.5 + (r() < 0.4 ? 0.5 : 0);
      items.facades.push({ side, z1: z, z2, h, floors, seed: Math.floor(r() * 4294967296), style: Math.floor(r() * 3), d: 6 + r() * 4, touchPrev: prev && !gap, key: c + ':' + side + ':' + i++ });
      z = z2; prev = true;
    }
  }
  chunkCache.set(c, items);
  if (chunkCache.size > 14) chunkCache.delete(chunkCache.keys().next().value);
  return items;
}

/* ---------- facades ---------- */
const FACADE_X = 17.5, PPM = 40;
const facadeCache = new Map();
const WALLS = ['#e9d8b4', '#d9b98a', '#c9785a', '#f1ece0', '#d8a84f', '#b9d3d6'];
const SHOPS = ['CAFÉ مقهى', 'BAKERY مخبز', 'SPICES بهارات', 'PERFUME عطور', 'SWEETS حلويات', 'GOLD ذهب', 'TEA شاي', 'BOOKS كتب'];
const SIGNS = ['#3b2418', '#1f3a2e', '#1d2f4d', '#6b1f26', '#2c2c34'];
const AWN = [['#c43a2e', '#f4efe2'], ['#2f7d4f', '#f4efe2'], ['#2d5fa3', '#f4efe2'], ['#c9902f', '#c9902f'], ['#a8362b', '#a8362b']];
const SHUT = ['#3f7a55', '#2f5f9a', '#6b4429', '#8a3b2c'];
function facadeTex(b) {
  let c = facadeCache.get(b.key); if (c) return c;
  const L = b.z2 - b.z1, w = Math.round(L * PPM), H_ = Math.round(b.h * PPM);
  c = document.createElement('canvas'); c.width = w; c.height = H_;
  const x = c.getContext('2d'), rr = mulberry32(b.seed);
  const R = (lo, hi) => lo + (hi - lo) * rr(), pick = a => a[Math.floor(rr() * a.length)];
  const rect = (col, a, b2, c2, d) => { x.fillStyle = col; x.fillRect(a, b2, c2, d); };
  const arch = (px, py, pw, ph) => { x.beginPath(); x.moveTo(px, py + ph); x.lineTo(px, py + pw / 2); x.arc(px + pw / 2, py + pw / 2, pw / 2, Math.PI, 0); x.lineTo(px + pw, py + ph); x.closePath(); };
  const wall = pick(WALLS);
  rect(wall, 0, 0, w, H_);
  let g = x.createLinearGradient(0, 0, 0, H_);
  g.addColorStop(0, 'rgba(255,248,225,0.22)'); g.addColorStop(0.5, 'rgba(255,248,225,0)'); g.addColorStop(1, 'rgba(60,35,15,0.28)');
  rect(g, 0, 0, w, H_);
  for (let i = 0; i < 26; i++) {
    x.fillStyle = rr() < 0.6 ? `rgba(90,60,30,${R(0.03, 0.08)})` : `rgba(255,250,235,${R(0.05, 0.12)})`;
    x.beginPath(); x.ellipse(R(0, w), R(0, H_), R(15, 70), R(10, 50), R(0, 3), 0, 6.3); x.fill();
  }
  for (let i = 0; i < 220; i++) rect(`rgba(70,45,25,${R(0.02, 0.07)})`, R(0, w), R(0, H_), R(1, 3), R(1, 3));
  const gT = H_ - 4 * PPM;                           // top of ground floor
  // upper floors
  for (let f = 0; f < b.floors; f++) {
    const yb = gT - 3 * PPM * f, n = Math.max(1, Math.floor(L / 2.5)), sp = w / n;
    const arched = rr() < 0.5, shut = rr() < 0.55, sc = pick(SHUT), balc = rr() < 0.4;
    for (let i = 0; i < n; i++) {
      const cx = (i + 0.5) * sp, ww = 38, wh = 70, wx = cx - ww / 2, wy = yb - 32 - wh;
      if (rr() < 0.12) continue;
      rect('rgba(70,45,25,0.35)', wx - 4, wy - 2, ww + 8, wh + 8);
      g = x.createLinearGradient(0, wy, 0, wy + wh); g.addColorStop(0, '#1d2a33'); g.addColorStop(1, '#3d5560');
      x.fillStyle = g; if (arched) arch(wx, wy, ww, wh); else { x.beginPath(); x.rect(wx, wy, ww, wh); } x.fill();
      x.strokeStyle = 'rgba(240,230,205,0.8)'; x.lineWidth = 2; x.stroke();
      x.fillStyle = 'rgba(255,255,255,0.12)'; x.beginPath(); x.moveTo(wx + 4, wy + wh); x.lineTo(wx + 16, wy + 6); x.lineTo(wx + 24, wy + 6); x.lineTo(wx + 12, wy + wh); x.fill();
      rect('rgba(240,230,205,0.7)', wx + ww / 2 - 1, wy + (arched ? ww / 2 : 0), 2, wh);
      if (shut) { rect(sc, wx - 11, wy + (arched ? 8 : 0), 10, wh - (arched ? 8 : 0)); rect(sc, wx + ww + 1, wy + (arched ? 8 : 0), 10, wh - (arched ? 8 : 0));
        for (let s = 0; s < 6; s++) { rect('rgba(0,0,0,0.25)', wx - 11, wy + 12 + s * 9, 10, 1.5); rect('rgba(0,0,0,0.25)', wx + ww + 1, wy + 12 + s * 9, 10, 1.5); } }
      rect('rgba(240,230,205,0.85)', wx - 4, wy + wh, ww + 8, 4);
      if (balc) {
        const bx = wx - 12, bw = ww + 24, by = yb - 32;
        rect('#b9ab92', bx - 3, by + 2, bw + 6, 6); rect('rgba(0,0,0,0.25)', bx - 3, by + 8, bw + 6, 4);
        x.strokeStyle = '#1e1a18'; x.lineWidth = 1.5; x.beginPath();
        for (let k = 0; k <= 10; k++) { x.moveTo(bx + k * bw / 10, by + 2); x.lineTo(bx + k * bw / 10, by - 20); }
        x.moveTo(bx, by - 20); x.lineTo(bx + bw, by - 20); x.moveTo(bx, by - 8); x.lineTo(bx + bw, by - 8); x.stroke();
        for (let k = 0; k < 2; k++) { const px = bx + 8 + k * (bw - 24); rect('#a65a38', px, by - 10, 8, 10); x.fillStyle = '#4c8a3c'; x.beginPath(); x.arc(px + 4, by - 14, 7, 0, 6.3); x.fill(); }
      }
    }
  }
  // cornice
  const yTop = gT - 3 * PPM * b.floors;
  rect('rgba(70,45,25,0.22)', 0, yTop - 14, w, 14); g = x.createLinearGradient(0, yTop - 14, 0, yTop - 2);
  g.addColorStop(0, 'rgba(50,30,15,0.35)'); g.addColorStop(1, 'rgba(50,30,15,0)'); rect(g, 0, yTop - 14, w, 14);
  rect('#efe3c6', 0, yTop - 22, w, 8); rect('#d9c9a5', 0, yTop - 16, w, 3); rect('rgba(40,25,10,0.4)', 0, yTop - 14, w, 2);
  rect('rgba(255,250,235,0.35)', 0, yTop - 22, w, 1.5);
  if (b.style === 2 && yTop - 22 > 12) for (let px = 12; px < w - 24; px += 36) rect('rgba(70,45,25,0.22)', px, 5, 22, yTop - 22 - 10);
  rect('rgba(70,45,25,0.25)', 0, 0, w, 2);
  // ground floor
  g = x.createLinearGradient(0, gT, 0, H_); g.addColorStop(0, 'rgba(40,25,10,0.18)'); g.addColorStop(1, 'rgba(40,25,10,0)'); rect(g, 0, gT, w, 160);
  rect('rgba(60,40,20,0.3)', 0, gT - 1, w, 3);
  rect('#9a8c78', 0, H_ - 12, w, 12); rect('rgba(0,0,0,0.22)', 0, H_ - 12, w, 2);
  const nb = L > 8.2 && rr() < 0.7 ? 2 : 1, bwid = w / nb, name = pick(SHOPS);
  for (let k = 0; k < nb; k++) {
    const bx = k * bwid + 14, bw = bwid - 28, nm = nb > 1 ? pick(SHOPS) : name;
    const door = bw > 150, dw = 46, winW = bw - (door ? dw + 14 : 0), dside = rr() < 0.5;
    const winX = bx + (door && dside ? dw + 14 : 0), doorX = dside ? bx : bx + winW + 14;
    // sign
    const sc = pick(SIGNS), sy = gT + 8;
    rect(sc, bx, sy, bw, 30); x.strokeStyle = '#c9a24a'; x.lineWidth = 2; x.strokeRect(bx + 2, sy + 2, bw - 4, 26);
    let fs = 20; x.font = `bold ${fs}px "Trebuchet MS",Arial,sans-serif`;
    const tw = x.measureText(nm).width; if (tw > bw - 14) { fs = Math.max(8, fs * (bw - 14) / tw); x.font = `bold ${fs}px "Trebuchet MS",Arial,sans-serif`; }
    x.fillStyle = '#f3e6c4'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(nm, bx + bw / 2, sy + 16);
    // display window
    const wy = gT + 66, wh = 160 - 66 - 18;
    rect('#6b5a48', winX - 3, wy - 3, winW + 6, wh + 6);
    g = x.createLinearGradient(0, wy, 0, wy + wh); g.addColorStop(0, '#16222a'); g.addColorStop(1, '#4a5f66');
    rect(g, winX, wy, winW, wh);
    for (let q = 0; q < 4; q++) rect(`rgba(${pick(['230,170,90', '200,90,70', '240,220,160'])},0.35)`, winX + R(6, winW - 30), wy + wh - R(12, 30), R(10, 24), R(8, 22));
    x.fillStyle = 'rgba(255,255,255,0.16)'; x.beginPath(); x.moveTo(winX + winW * 0.15, wy + wh); x.lineTo(winX + winW * 0.15 + 26, wy); x.lineTo(winX + winW * 0.15 + 42, wy); x.lineTo(winX + winW * 0.15 + 16, wy + wh); x.fill();
    // door
    if (door) {
      const dy = gT + 48, dh = 160 - 48 - 12;

  ctx.restore();
  ctx.save();
  ctx.translate(sx, by);
  const lean = Math.max(-1, Math.min(1, P.vx / 2)) * 0.07;
  ctx.rotate(lean);
  ctx.drawImage(im, -w * META.pivot, -h, w, h);
  ctx.restore();
}

/* ---------- update ---------- */
let lastDisplayed = -1;
function update(dt) {
  // input vector
  let ix = joy.x, iy = joy.y;                       // iy>0 forward
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iy += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iy -= 1;
  ix = Math.max(-1, Math.min(1, ix)); iy = Math.max(-1, Math.min(1, iy));

  const targetVz = Math.max(0, iy) * 2.4;
  const targetVx = ix * 2.1;
  const ease = 1 - Math.exp(-dt * 6);
  P.vz += (targetVz - P.vz) * ease;
  P.vx += (targetVx - P.vx) * ease;
  P.z += P.vz * dt;
  P.x += P.vx * dt;
  if (P.x > STREET_HALF) { P.x = STREET_HALF; P.vx = 0; }
  if (P.x < -STREET_HALF) { P.x = -STREET_HALF; P.vx = 0; }
  const speed = Math.hypot(P.vz, P.vx * 0.5);
  P.phase += speed * dt / 2.4 * 24;                   // 24 video frames per stride (2.4 m) = natural 24 fps at walking pace

  // camera preset easing
  const cp = CAM_PRESETS[camIdx], ce = 1 - Math.exp(-dt * 5);
  cam.h += (cp.h - cam.h) * ce; cam.hz += (cp.hz - cam.hz) * ce; cam.dz += (cp.dz - cam.dz) * ce;

  // yaw recenters gently when not dragging
  if (!dragging && performance.now() - lastLook > 1200) yaw *= Math.exp(-dt * 1.4);

  const d = Math.floor(P.z);
  if (d !== lastDisplayed) {
    lastDisplayed = d;
    $('distv').textContent = String(Math.max(0, d)).padStart(5, '0') + ' m';
  }
}

/* ---------- input ---------- */
addEventListener('keydown', e => {
  if (e.repeat) { if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault(); return; }
  keys.add(e.code);
  if (e.code === 'KeyQ') camIdx = (camIdx + CAM_PRESETS.length - 1) % CAM_PRESETS.length;
  if (e.code === 'KeyE') camIdx = (camIdx + 1) % CAM_PRESETS.length;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyH') $('hint').style.opacity = $('hint').style.opacity === '0' ? '1' : '0';
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

function togglePause() { paused = !paused; document.body.classList.toggle('paused', paused); if (!paused) last = performance.now(); }
$('pause').addEventListener('click', togglePause);

// look-around by dragging the scene
cv.addEventListener('pointerdown', e => {
  dragging = { id: e.pointerId, x: e.clientX };
  cv.setPointerCapture(e.pointerId);
  $('look').style.opacity = '0';
});
cv.addEventListener('pointermove', e => {
  if (!dragging || e.pointerId !== dragging.id) return;
  const dx = e.clientX - dragging.x; dragging.x = e.clientX;
  yaw = Math.max(-0.4, Math.min(0.4, yaw - dx * 0.0022));
  lastLook = performance.now();
});
const endDrag = e => { if (dragging && e.pointerId === dragging.id) { dragging = null; lastLook = performance.now(); } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// virtual joystick
(() => {
  const el = $('stick'), knob = $('knob');
  let id = null;
  const set = (e) => {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = r.width / 2;
    let dx = (e.clientX - cx) / R, dy = (e.clientY - cy) / R;
    const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    knob.style.transform = `translate(${dx * R * 0.5}px, ${dy * R * 0.5}px)`;
    const dead = 0.12;
    joy.x = Math.abs(dx) < dead ? 0 : dx; joy.y = Math.abs(dy) < dead ? 0 : -dy;
  };
  const reset = () => { id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
  el.addEventListener('pointerdown', e => { id = e.pointerId; el.setPointerCapture(id); set(e); e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) set(e); });
  el.addEventListener('pointerup', e => { if (e.pointerId === id) reset(); });
  el.addEventListener('pointercancel', reset);
})();

setTimeout(() => { if ($('look')) $('look').style.opacity = '0'; }, 14000);
if (!isTouch) $('look').innerHTML = '⌖ DRAG TO LOOK AROUND';

/* ---------- loop ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) update(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  frame(dt);
  requestAnimationFrame(loop);
}

resize();
loadAll().then(() => {
  buildTile();
  $('loading').style.display = 'none';
  last = performance.now();
  requestAnimationFrame(loop);
});

// test hook for headless checks
window.__game = { P, cam, get yaw() { return yaw; }, keys, IMG };
})();
</script>
</body>
</html>
